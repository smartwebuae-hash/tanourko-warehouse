<style>
  :root{
    --line:#000;
    --bg:#ffffff;
    --text:#000000;
    --muted:#555555;
    --danger:#b00000;
    --good:#1a7a1a;
    --header-bg:#1c1c1c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:100%;margin:0 auto;padding:14px 10px 60px;}
  h1{font-size:20px;margin:0 0 4px;font-weight:800;text-align:center;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px;text-align:center;}
  .center-screen{display:flex;flex-direction:column;justify-content:center;min-height:80vh;max-width:340px;margin:0 auto;padding:0 12px;}
  .login-card{border:2px solid var(--line);border-radius:12px;padding:22px 18px;}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;}
  input[type="text"], input[type="password"]{
    width:100%;border:2px solid var(--line);border-radius:8px;padding:11px;font-size:15px;
    margin-bottom:14px;font-family:inherit;background:#fff;color:#000;
  }
  button.big{
    width:100%;padding:13px;border-radius:10px;border:2px solid var(--line);font-size:15px;
    font-weight:800;cursor:pointer;font-family:inherit;background:#000;color:#fff;
  }
  .msg{font-size:13px;padding:9px 10px;border-radius:8px;margin-bottom:12px;text-align:center;font-weight:700;}
  .msg-error{background:#ffeaea;border:1.5px solid var(--danger);color:#900000;}
  .msg-success{background:#eaffea;border:1.5px solid var(--good);color:#186818;}
  .top-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:12px;}
  .top-bar input[type="text"]{width:auto;flex:1;min-width:140px;margin-bottom:0;padding:9px 10px;font-size:14px;}
  .actions-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  button.action{
    padding:11px 14px;border-radius:8px;border:2px solid var(--line);font-size:13.5px;
    font-weight:800;cursor:pointer;font-family:inherit;background:#fff;color:#000;white-space:nowrap;
  }
  button.action.primary{background:#000;color:#fff;}
  button.action.whatsapp{background:#25D366;color:#fff;border-color:#25D366;}
  button.action.logout{background:#fff;color:var(--danger);border-color:var(--danger);}
  .table-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:8px;}
  table{width:100%;border-collapse:collapse;min-width:1150px;}
  thead th{
    position:sticky;top:0;background:var(--header-bg);color:#fff;border:1px solid #444;
    padding:8px 5px;font-size:12px;font-weight:800;text-align:center;white-space:nowrap;
  }
  tbody td{border:1px solid #ccc;padding:4px;text-align:center;vertical-align:middle;}
  tbody tr:nth-child(even){background:#fafafa;}
  tbody td input, tbody td select{
    width:100%;border:1px solid #bbb;border-radius:4px;padding:6px 3px;font-size:12.5px;
    font-family:inherit;text-align:center;background:#fff;color:#000;min-width:60px;
  }
  tbody td input.name-cell{text-align:right;min-width:150px;}
  tbody td input.note-cell{text-align:right;min-width:120px;}
  td.num-col{font-size:11.5px;color:var(--muted);font-weight:700;width:34px;}
  .qty-cell{display:flex;gap:3px;}
  .qty-cell input{min-width:44px;}
  .qty-cell select{min-width:56px;}
  .row-actions button{
    background:#fff;border:1.5px solid var(--danger);color:var(--danger);border-radius:5px;
    padding:5px 8px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap;

    width:100%;padding:12px;border:2px dashed var(--line);background:#fff;border-radius:8px;
    font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;margin-top:12px;

  .img-btn{

    font-size:16px;padding:6px 8px;line-height:1;
  }
  .img-btn.has-img{background:#e6ffe6;border-color:var(--good);}
  .img-btn.no-img{background:#f2f2f2;border-color:#999;color:#777;}
  #lightbox-overlay{

  }
  @media print{
    .no-print{display:none !important;}

  }

      '<p style="font-size:12px;color:#555;">Please check your internet connection and reload the page.</p>'+
    '</div>';
  }
}

  return { id: uid(), name:'', pack:'', section:'', notes:'', currentQty:0, currentUnit:'كيلو', neededQty:0, neededUnit:'كيلو', invoiceImage:null };
}
function seedDefault(){
  return SEED_ITEMS.map(s => ({
    id: uid(), name: s.name, pack: s.pack, section: s.section, notes: s.notes,
    currentQty: 0, currentUnit: 'كيلو', neededQty: 0, neededUnit: 'كيلو', invoiceImage:null

function unitOptions(selected){
  return ['حبة','كيلو','جونية','لتر','كرتون'].map(u=>`<option value="${u}" ${u===selected?'selected':''}>${u}</option>`).join('');
}

let state = { loggedIn:false, username:'', password:'', loginError:null, loading:true, items:[], search:'', message:null };
let saveTimer = null;
let creds = { username: DEFAULT_USERNAME, password: DEFAULT_PASSWORD };

async function init(){
  let storedCreds = await settingsGet(LOGIN_KEY);
  if(!storedCreds || !storedCreds.username){
    storedCreds = { username: DEFAULT_USERNAME, password: DEFAULT_PASSWORD };
    await settingsSet(LOGIN_KEY, storedCreds);
  }
  creds = storedCreds;

  let items = await settingsGet(ITEMS_KEY);
  if(!Array.isArray(items) || items.length === 0){
    items = seedDefault();
    await settingsSet(ITEMS_KEY, items);
  }
  items.forEach(it=>{ if(it.invoiceImage === undefined) it.invoiceImage = null; });
  state.items = items;
  state.loading = false;
  render();
}

function addRow(){
  state.items.push(emptyItem());
  render();
}
function removeRow(id){
  if(!confirm('حذف هذا الصنف نهائيًا؟')) return;
  state.items = state.items.filter(i=>i.id!==id);
  render();
}

function canvasToPdfBlob(canvas){
  const { jsPDF } = window.jspdf;
  const imgWidth = canvas.width;
  const imgHeight = canvas.height;
  const pdfWidthMM = 277;
  const pxToMM = pdfWidthMM / imgWidth;
  const pdfHeightMM = imgHeight * pxToMM;
  const pageHeightMM = 190;
  const marginX = 10, marginY = 10;
  const pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  if(pdfHeightMM <= pageHeightMM){
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, pdfHeightMM);
  } else {
    const pageHeightPx = Math.floor(pageHeightMM / pxToMM);
    let renderedHeight = 0;
    let first = true;
    while(renderedHeight < imgHeight){
      const sliceHeight = Math.min(pageHeightPx, imgHeight - renderedHeight);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = imgWidth;
      pageCanvas.height = sliceHeight;
      const ctx = pageCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, renderedHeight, imgWidth, sliceHeight, 0, 0, imgWidth, sliceHeight);
      const sliceHeightMM = sliceHeight * pxToMM;
      if(!first) pdf.addPage();
      pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, sliceHeightMM);
      renderedHeight += sliceHeight;
      first = false;
    }
  }
  return pdf.output('blob');
}

async function shareOrDownloadPdf(canvas, filenameBase){
  if(typeof window.jspdf === 'undefined'){ alert('تعذّر تحميل أداة إنشاء PDF.'); return; }
  let pdfBlob;
  try{ pdfBlob = canvasToPdfBlob(canvas); }
  catch(e){ alert('تعذّر إنشاء ملف PDF.'); return; }
  const fname = filenameBase + '.pdf';
  const file = new File([pdfBlob], fname, { type:'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title: filenameBase }); return; }catch(e){ /* cancelled */ }
  }
  const url = URL.createObjectURL(pdfBlob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  alert('تم حفظ ملف PDF في جهازك. افتحه وشاركه على واتساب.');
}

async function exportAndShare(){
  const target = document.getElementById('capture-area');
  if(typeof html2canvas === 'undefined'){ alert('تعذّر تحميل أداة التصوير.'); return; }
  let canvas;
  try{
    canvas = await html2canvas(target, {
      backgroundColor:'#ffffff', scale:2, useCORS:true,
      windowWidth: target.scrollWidth, windowHeight: target.scrollHeight,
      width: target.scrollWidth, height: target.scrollHeight
    });
  }catch(e){ alert('تعذّر إنشاء صورة الكشف.'); return; }
  await shareOrDownloadPdf(canvas, 'جرد-المخزون-تنورك-' + todayDisplay().replace(/\//g,'-'));
}

let pendingImageItemId = null;

function openLightbox(itemId){
  const item = state.items.find(i=>i.id===itemId);
  if(!item || !item.invoiceImage) return;
  document.getElementById('lightbox-img').src = item.invoiceImage;
  document.getElementById('lightbox-overlay').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox-overlay').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
function triggerAddImage(itemId){
  pendingImageItemId = itemId;
  document.getElementById('invoice-file-input').click();
}
function handleInvoiceFileSelected(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file || !pendingImageItemId) return;
  const itemId = pendingImageItemId;
  pendingImageItemId = null;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = function(ev){
    img.onload = function(){
      const maxDim = 1000;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const item = state.items.find(i=>i.id===itemId);
      if(item){ item.invoiceImage = dataUrl; render(); }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function App(){
  const app = document.getElementById('app');
  app.dataset.rendered = '1';

  const activeEl = document.activeElement;
  const focusInfo = (activeEl && activeEl.id && app.contains(activeEl))
    ? { id: activeEl.id, start: activeEl.selectionStart, end: activeEl.selectionEnd }
    : null;

  if(state.loading){
    app.innerHTML = '<div style="text-align:center;padding:60px 0;">جارِ التحميل...</div>';
    return;
  }

  if(!state.loggedIn){
    app.innerHTML = `
      <div class="center-screen">
        <h1>جرد المخزون</h1>
        <p class="sub">مطعم ومطبخ تنوركو</p>
        <div class="login-card">
          ${state.loginError ? `<div class="msg msg-error">${state.loginError}</div>` : ''}
          <label>اسم المستخدم</label>
          <input type="text" id="username-input" placeholder="اسم المستخدم">
          <label>كلمة السر</label>
          <input type="password" id="password-input" placeholder="••••••••">
          <button class="big" id="login-btn">دخول</button>
        </div>
      </div>
    `;
    document.getElementById('login-btn').onclick = ()=>{
      const u = document.getElementById('username-input').value.trim();
      const p = document.getElementById('password-input').value;
      if(u === creds.username && p === creds.password){
        state.loggedIn = true;
        state.loginError = null;
      } else {
        state.loginError = 'اسم المستخدم أو كلمة السر غير صحيحة';
      }
      render();
    };
    return;
  }

  const filtered = state.items.filter(i => (i.name||'').includes(state.search.trim()));

  app.innerHTML = `
    <h1>جرد المخزون</h1>
    <p class="sub">مطعم ومطبخ تنوركو — ${todayDisplay()}</p>
    ${state.message ? `<div class="msg msg-success">${state.message.text}</div>` : ''}
    <div class="top-bar no-print">
      <input type="text" id="search-input" placeholder="🔍 ابحث عن صنف..." value="${state.search.replace(/"/g,'&quot;')}">
      <button class="action logout" id="logout-btn">خروج</button>
    </div>
    <div id="capture-area">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ت</th>
              <th>الصنف</th>
              <th>العبوة / الكرتون</th>
              <th>القسم</th>
              <th>الموجود حاليًا</th>
              <th>الناقص من الستور</th>
              <th>ملاحظات</th>
              <th class="no-print">صورة الفاتورة</th>
              <th class="no-print">إجراء</th>
            </tr>
          </thead>
          <tbody id="rows-body"></tbody>
        </table>
      </div>
    </div>
    <input type="file" id="invoice-file-input" accept="image/*" style="display:none;">
    <div id="lightbox-overlay">
      <img id="lightbox-img" src="" alt="صورة الفاتورة">
      <button id="lightbox-close">إغلاق ✕</button>
    </div>
    <button class="add-row-btn no-print" id="add-row-btn">+ إضافة صنف جديد</button>
    <div class="actions-bar no-print">
      <button class="action primary" id="save-btn">💾 حفظ الآن</button>
      <button class="action whatsapp" id="wa-btn">📲 حفظ PDF وإرسال واتساب</button>
      <button class="action" id="print-btn">🖨️ طباعة</button>
    </div>
    <p class="autosave-badge no-print">⚠️ التعديلات لا تُحفظ تلقائيًا — اضغط "💾 حفظ الآن" بعد ما تخلص كل تعديلاتك</p>
  `;

  document.getElementById('logout-btn').onclick = ()=>{ state.loggedIn=false; render(); };
  document.getElementById('search-input').oninput = (e)=>{ state.search = e.target.value; render(); };
  document.getElementById('add-row-btn').onclick = addRow;
  document.getElementById('save-btn').onclick = async ()=>{
    await settingsSet(ITEMS_KEY, state.items);
    state.message = { type:'success', text:'✅ تم الحفظ' };
    render();
    setTimeout(()=>{ state.message=null; render(); }, 1500);
  };
  document.getElementById('wa-btn').onclick = exportAndShare;
  document.getElementById('print-btn').onclick = ()=> window.print();

  const tbody = document.getElementById('rows-body');
  filtered.forEach((item, idx)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="num-col">${idx+1}</td>
      <td><input type="text" class="name-cell" data-field="name" value="${(item.name||'').replace(/"/g,'&quot;')}" placeholder="اسم الصنف"></td>
      <td><input type="text" data-field="pack" value="${(item.pack||'').replace(/"/g,'&quot;')}" placeholder="مثال: 10 ك"></td>
      <td><input type="text" data-field="section" value="${(item.section||'').replace(/"/g,'&quot;')}" placeholder="القسم"></td>
      <td>
        <div class="qty-cell">
          <input type="number" step="any" data-field="currentQty" value="${item.currentQty}">
          <select data-field="currentUnit">${unitOptions(item.currentUnit)}</select>
        </div>
      </td>
      <td>
        <div class="qty-cell">
          <input type="number" step="any" data-field="neededQty" value="${item.neededQty}">
          <select data-field="neededUnit">${unitOptions(item.neededUnit)}</select>
        </div>
      </td>
      <td><input type="text" class="note-cell" data-field="notes" value="${(item.notes||'').replace(/"/g,'&quot;')}" placeholder="ملاحظات"></td>
      <td class="no-print">
        ${item.invoiceImage
          ? `<button class="img-btn has-img" data-view-img="${item.id}">📷</button>`
          : `<button class="img-btn no-img" data-add-img="${item.id}">➕📷</button>`}
      </td>
      <td class="row-actions no-print"><button data-remove="${item.id}">حذف</button></td>
    `;
    tbody.appendChild(tr);
    tr.querySelectorAll('[data-field]').forEach(el=>{
      el.oninput = ()=>{
        const field = el.dataset.field;
        let val = el.value;
        if(field==='currentQty' || field==='neededQty') val = parseFloat(val) || 0;
        item[field] = val;
      };
    });
  });
  tbody.querySelectorAll('[data-view-img]').forEach(btn=>{
    btn.onclick = ()=> openLightbox(btn.dataset.viewImg);
  });
  tbody.querySelectorAll('[data-add-img]').forEach(btn=>{
    btn.onclick = ()=> triggerAddImage(btn.dataset.addImg);
  });
  document.getElementById('lightbox-close').onclick = closeLightbox;
  document.getElementById('lightbox-overlay').onclick = (e)=>{ if(e.target.id === 'lightbox-overlay') closeLightbox(); };
  document.getElementById('invoice-file-input').onchange = handleInvoiceFileSelected;
  tbody.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = ()=> removeRow(btn.dataset.remove);
  });

  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus();
      if(typeof el.setSelectionRange === 'function' && focusInfo.start !== null && focusInfo.start !== undefined){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

function render(){ App(); }

init().catch(function(err){ showFatalError('Init failed: ' + (err && err.message ? err.message : err)); });
</script>
</body>
